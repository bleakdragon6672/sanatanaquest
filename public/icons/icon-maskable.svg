<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2c1a0e" />
      <stop offset="50%" stop-color="#19110b" />
      <stop offset="100%" stop-color="#0e0a07" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Sacred Background -->
  <rect width="512" height="512"  fill="url(#bgGrad)" />

  <g transform="translate(256, 256) scale(0.68) translate(-256, -256)">
    <!-- Divine Aura Glow -->
    <circle cx="256" cy="256" r="190" fill="url(#auraGlow)" />

    <!-- Outer Decorative Sacred Mandala Ring -->
    <circle cx="256" cy="256" r="216" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="202" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.75" />
    <circle cx="256" cy="256" r="192" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5" />

    <!-- 12 Radiating Rays of Knowledge -->
    <line x1="431.0" y1="256.0" x2="444.0" y2="256.0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="407.6" y1="343.5" x2="418.8" y2="350.0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="343.5" y1="407.6" x2="350.0" y2="418.8" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="256.0" y1="431.0" x2="256.0" y2="444.0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="168.5" y1="407.6" x2="162.0" y2="418.8" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="104.4" y1="343.5" x2="93.2" y2="350.0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="81.0" y1="256.0" x2="68.0" y2="256.0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="104.4" y1="168.5" x2="93.2" y2="162.0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="168.5" y1="104.4" x2="162.0" y2="93.2" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="256.0" y1="81.0" x2="256.0" y2="68.0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="343.5" y1="104.4" x2="350.0" y2="93.2" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="407.6" y1="168.5" x2="418.8" y2="162.0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />

    <!-- Sacred 8-Petal Geometry / Mandala Points -->
    <circle cx="411.0" cy="256.0" r="3" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="365.6" cy="365.6" r="3" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="256.0" cy="411.0" r="3" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="146.4" cy="365.6" r="3" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="101.0" cy="256.0" r="3" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="146.4" cy="146.4" r="3" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="256.0" cy="101.0" r="3" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="365.6" cy="146.4" r="3" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Golden Om (Aum) Glyph -->
    <g filter="url(#glow)">
      <!-- Beautifully drawn Devanagari Sacred Om glyph -->
      <path d="
        M 190 220
        C 190 175 235 155 260 180
        C 285 205 260 235 240 240
        C 275 245 295 285 275 325
        C 255 365 195 365 180 335
        C 170 315 185 300 200 305
        C 215 310 215 330 235 330
        C 255 330 265 305 250 280
        C 235 255 205 260 195 245
        C 188 235 190 225 190 220 Z
        M 260 240
        C 290 240 325 255 340 290
        C 350 310 350 340 350 360
        C 345 365 335 365 330 355
        C 330 335 330 315 320 300
        C 310 280 285 270 260 270 Z
        M 315 175
        C 325 195 345 205 375 200
        C 365 190 355 175 355 155
        C 355 145 360 140 365 140
        C 370 140 375 145 375 155
        C 375 180 395 195 410 195
        C 400 185 390 170 390 150
        C 390 130 405 125 415 135
        M 305 140
        C 335 130 370 130 395 140
        C 370 150 335 150 305 140 Z
        M 345 105
        A 14 14 0 1 1 345 133
        A 14 14 0 1 1 345 105 Z
      " fill="url(#goldGrad)" fill-rule="evenodd" />

      <!-- Central Sacred Bindu (Radiant Dot) -->
      <circle cx="345" cy="119" r="8" fill="#FFFBEB" />
      <circle cx="345" cy="119" r="16" fill="url(#goldGrad)" opacity="0.4" />
    </g>
  </g>
</svg>
